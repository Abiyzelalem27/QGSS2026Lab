[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qgss2026-lab"
version = "0.1.0"
description = "Quantum computing projects from QGSS 2026"
readme = "README.md"
requires-python = ">=3.10"

authors = [
    {name = "Abiy Zelalem Tegegne"}
]

dependencies = [
    "qiskit[visualization]>=2.0",
    "qiskit-aer",
    "qiskit-ibm-runtime",
    "numpy",
    "matplotlib",
    "networkx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "jupyterlab",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
